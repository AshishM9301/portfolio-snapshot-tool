services:
  # Redis for BullMQ
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  # BullMQ worker (will run your worker code)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - NUM_WORKERS=3
    depends_on:
      - redis
    restart: unless-stopped

  # Cleanup service
  cleanup:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: bun run src/server/worker/cleanup-old-jobs.ts
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped