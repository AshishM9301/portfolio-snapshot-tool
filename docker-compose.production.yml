services:
  # Next.js App (Frontend + Backend) - User Access
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        - SKIP_ENV_VALIDATION=true
        - NODE_ENV=production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://app:3000
      - REDIS_URL=${REDIS_URL}
      - HOSTNAME=0.0.0.0
    volumes:
      - temp_images:/app/temp/images
    networks:
      - app-network
    restart: unless-stopped
    command: ["bun", "run", "start"]
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # External Redis - no local Redis needed
  # redis:
  #   image: redis:7
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

  # BullMQ worker (Backend only, no external ports) - Reduced to 1 worker for limited CPU
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker-only
      args:
        - SKIP_ENV_VALIDATION=true
        - NODE_ENV=production
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - NUM_WORKERS=1
      - NODE_ENV=production
      - WORKER_MODE=true
      - NEXT_PUBLIC_APP_URL=http://app:3000
      - APP_INTERNAL_URL=http://app:3000
      - PUPPETEER_ARGS=--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--single-process
    volumes:
      - temp_images:/app/temp/images
    networks:
      - app-network
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.3'
          memory: 0.8G

  # Cleanup service - Runs less frequently to save resources
  cleanup:
    build:
      context: .
      dockerfile: Dockerfile.worker-only
      args:
        - SKIP_ENV_VALIDATION=true
        - NODE_ENV=production
    command: bun run src/server/worker/cleanup-old-jobs.ts
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_MODE=true
      - REDIS_URL=${REDIS_URL}
    volumes:
      - temp_images:/app/temp/images
    networks:
      - app-network
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 0.5G
        reservations:
          cpus: '0.1'
          memory: 0.2G

# Define shared volumes
volumes:
  temp_images:

# Define custom network for service communication
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 